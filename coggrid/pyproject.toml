[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coggrid"
version = "0.2.0"
description = "A stationary POMDP for studying compositional generalisation in latent space"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John Schwarcz" }]
keywords = ["reinforcement-learning", "pomdp", "bayesian-inference", "gymnasium"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]

# The environment is pure numpy. That is the whole dependency list.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Plotting. Kept out of the core so that headless / CI installs stay small.
viz = ["matplotlib>=3.7", "seaborn>=0.13"]
# Registry integration and wrapper compatibility.
gym = ["gymnasium>=0.29"]
dev = [
  "coggrid[viz,gym]",
  "pytest>=7.4",
  "pytest-doctestplus>=1.0",
  "ruff>=0.5",
  "mypy>=1.8",
]
all = ["coggrid[viz,gym]"]

[project.urls]
Homepage = "https://github.com/johnschwarcz/coggrid"
Paper = "https://arxiv.org/abs/2603.27134"
"Reference implementation" = "https://github.com/johnschwarcz/CognitiveGridworld"

[tool.hatch.build.targets.wheel]
packages = ["src/coggrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules --doctest-glob='*.md'"
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
