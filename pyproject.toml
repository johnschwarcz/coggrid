[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coggrid"
version = "0.2.0"
description = "A stationary POMDP for studying compositional generalization in latent space"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John Schwarcz" }]
keywords = ["reinforcement-learning", "pomdp", "bayesian-inference", "gymnasium"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]

dependencies = ["numpy>=1.24", "gymnasium>=0.29"]

[project.optional-dependencies]
# Plotting. Kept out of the core so that headless / CI installs stay small.
viz = ["matplotlib>=3.7", "seaborn>=0.13"]
dev = [
  "coggrid[viz]",
  "pytest>=7.4",
  "ruff>=0.5",
  "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/johnschwarcz/coggrid"
Paper = "https://arxiv.org/abs/2603.27134"

[tool.hatch.build.targets.wheel]
packages = ["src/coggrid"]

[tool.pytest.ini_options]
# src is on the list so the docstring examples are executed, not just written.
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
