[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coggrid"
version = "0.3.0"
description = "A stationary POMDP for studying compositional generalization in latent space"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Schwarcz", email = "Johnschwarcz@gmail.com" }]
keywords = [
  "reinforcement-learning",
  "pomdp",
  "bayesian-inference",
  "gymnasium",
  "compositional-generalization",
  "ideal-observer",
  "disentanglement",
  "toy-model",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]

dependencies = ["numpy>=1.24", "gymnasium>=0.29"]

[project.optional-dependencies]
# Plotting, kept out of the core so that headless / CI installs stay small.
# Pillow writes the GIFs, and 9.1 is the first with Image.Dither.
viz = ["matplotlib>=3.7", "pillow>=9.1"]
# Optional CUDA acceleration of the joint observer (coggrid.torch).
# 2.4.1 is the first torch whose wheels work with NumPy 2 on every OS.
torch = ["torch>=2.4.1"]
dev = [
  "coggrid[viz]",
  "pytest>=7.4",
  "ruff>=0.13",
  "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/johnschwarcz/coggrid"
Repository = "https://github.com/johnschwarcz/coggrid"
Issues = "https://github.com/johnschwarcz/coggrid/issues"
Paper = "https://arxiv.org/abs/2603.27134"

[tool.hatch.build.targets.wheel]
packages = ["src/coggrid"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/images", ".github"]

[tool.pytest.ini_options]
# src is on the list so the docstring examples are executed, not just written.
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]  # long lines are allowed: docstrings keep a sentence per line, messages a line each

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
