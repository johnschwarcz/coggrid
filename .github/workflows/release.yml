name: Release

on:
  release:
    types: [published]

# Each job asks for only what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Only what checkout needs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: pipx run build

      - name: Check metadata
        run: pipx run twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI mints a short-lived token from this OIDC
    # identity, so there is no API token to store or rotate.
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
